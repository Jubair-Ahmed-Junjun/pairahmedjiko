name: Auto-Update Google Scholar Data

on:
  schedule:
    # Runs automatically every day at 00:00 UTC
    - cron: '0 0 * * *'
  # Also lets you trigger an update manually with one click in GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scholarly library
        run: pip install scholarly

      - name: Fetch Google Scholar profile
        run: |
          python -c "
          import json
          from scholarly import scholarly

          author = scholarly.search_author_id('xTO_1HwAAAAJ')
          author = scholarly.fill(author, sections=['basics', 'indices', 'publications'])

          pubs = []
          for p in author.get('publications', []):
              bib = p.get('bib', {})
              citation_str = bib.get('citation', '')
              title_str = bib.get('title', '')
              is_preprint = any(k in citation_str.lower() for k in ['biorxiv', 'ssrn', 'research square', 'preprint'])
              is_phytochem = any(k in title_str.lower() for k in ['extract', 'mucuna', 'ficus', 'shirakiopsis', 'swintonia', 'herbal', 'taro', 'ginger'])

              pubs.append({
                  'title': title_str,
                  'authors': bib.get('author', ''),
                  'venue': citation_str,
                  'year': int(bib.get('pub_year', 2026)) if str(bib.get('pub_year', '')).isdigit() else 2026,
                  'citations': p.get('num_citations', 0),
                  'type': 'preprint' if is_preprint else 'journal',
                  'categories': ['preprint' if is_preprint else 'journal', 'phytochem' if is_phytochem else 'clinical'],
                  'doiUrl': 'https://scholar.google.com/citations?user=xTO_1HwAAAAJ&hl=en',
                  'doiText': citation_str or 'Google Scholar Indexed',
                  'summary': 'Automatically synced from Google Scholar profile.'
              })

          data = {
              'citations': author.get('citedby', 37),
              'h_index': author.get('hindex', 3),
              'i10_index': author.get('i10index', 1),
              'publications': pubs
          }

          with open('scholar_data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          "

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scholar_data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update Google Scholar metrics & publications"
          git push
